    <header>

    <section id="feature-list">
        <a class="feature-row" href="nature.html">
            <div class="feature-thumb">
                <img src="tania-bnw-portfolio/photo1.jpeg" alt="Nature photography">
            </div>
            <div class="feature-text">
                <p class="feature-tag">Explore the Series</p>
                <h3 class="feature-title">Nature</h3>
            </div>
        </a>

        <a class="feature-row" href="architecture.html">
            <div class="feature-thumb">
                <img src="tania-bnw-portfolio/photo2.jpeg" alt="Architecture photography">
            </div>
            <div class="feature-text">
                <p class="feature-tag">Explore the Series</p>
                <h3 class="feature-title">Architecture</h3>
            </div>
        </a>

        <a class="feature-row" href="people.html">
            <div class="feature-thumb">
                <img src="tania-bnw-portfolio/photo39.jpeg" alt="Portrait photography">
            </div>

    <div id="music-toggle">
        <audio id="bg-music" loop>
            <source src="tania-bnw-portfolio/theme.mp3" type="audio/mpeg">
        </audio>
        <button id="music-btn">🎵</button>
    </div>

    <script>
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');

    const savedTime = localStorage.getItem('musicTime');
    const wasPlaying = localStorage.getItem('musicOn') === 'true';

    bgMusic.addEventListener('loadedmetadata', () => {
        if (savedTime) {
            bgMusic.currentTime = parseFloat(savedTime);
        }
        if (wasPlaying) {
            bgMusic.play().catch(() => {});
            musicBtn.classList.add('playing');
        }
    });

    musicBtn.addEventListener('click', () => {
        if (bgMusic.paused) {
            bgMusic.play();
            musicBtn.classList.add('playing');
            localStorage.setItem('musicOn', 'true');
        } else {
            bgMusic.pause();
            musicBtn.classList.remove('playing');
            localStorage.setItem('musicOn', 'false');
        }
    });

    bgMusic.addEventListener('timeupdate', () => {
        localStorage.setItem('musicTime', bgMusic.currentTime);
    });

    window.addEventListener('beforeunload', () => {
        localStorage.setItem('musicTime', bgMusic.currentTime);
    });
</script>
</body>
</html>
