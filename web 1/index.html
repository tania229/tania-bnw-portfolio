<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>tania_bnw | Black & White Photography</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    
<nav>
        <div class="logo">tania-bnw</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
     </nav>

    <section id="hero">
    <img src="tania-bnw-portfolio/photo6.jpg.jpeg" alt="Featured black and white photography" class="hero-img">
    <div class="hero-overlay">
        <h1>tania_bnw🖤</h1>
        <p>black & white photography — nature . architecture . people</p>
        <a href="portfolio.html" class="hero-btn">View Portfolio</a>
    </div>
</section>
     

     <section id="photo-gallery">
         

         <div class="photo-item" data-caption="Golden hour, home"><img src="tania-bnw-portfolio/photo1.jpeg" alt="Black and white nature photography"></div>
           
         
         <div class="photo-item" data-caption="Temple architecture"><img src="tania-bnw-portfolio/photo2.jpeg" alt="Black and white architecture photography"></div>
         <div class="photo-item" data-caption="A quiet moment"><img src="tania-bnw-portfolio/photo4.jpeg" alt="Black and white portrait"></div>
         <div class="photo-item" data-caption="Reflections"><img src="tania-bnw-portfolio/photo7.jpeg" alt="Black and white nature photography"></div>
         <div class="photo-item" data-caption="Petals in focus"><img src="tania-bnw-portfolio/photo5.jpeg" alt="Black and white nature photography"></div>
      </section>

      <div id="lightbox">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src=""alt="Enlarged photo">
        <a id="lightbox-insta" href="https://www.instagram.com/tania-bnw-portfolio/" target="_blank">View on instagram➡️</a>
      </div>

        
     
     <script>
        
        const items = document.querySelectorAll('.photo-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');

        items.forEach(img => {
        img.addEventListener('click',() => {
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
           if (e.target === lightbox) {
              lightbox.classList.remove('active');
           }
        });

        </script>
</body>
</html>
